name: CI (Linux, macOS, Windows)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout código-fonte
        uses: actions/checkout@v4

      # ============================================================
      # Dependências do sistema (Linux)
      # ============================================================
      - name: Instalar dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxmu-dev \
            pkg-config

      # ============================================================
      # Configurar e compilar
      # ============================================================
      - name: Configurar CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release

      # ============================================================
      # Verificar artefatos
      # ============================================================
      - name: Verificar executável (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ls -la build/bin/
          file build/bin/ImAlgorithm

      - name: Verificar executável (Windows)
        if: runner.os == 'Windows'
        run: |
          dir build\bin\Release\
        shell: cmd